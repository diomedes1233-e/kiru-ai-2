# ─────────────────────────────────────────────────────────────────────────────
# Release — Create GitHub release from CHANGELOG, trigger Kiru-Ai build
# Runs on pushes to main when package.json version changes
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Create release and trigger downstream workflows ──────────────────────
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Abort if package.json unchanged
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -q "^package.json$"; then
            echo "package.json not modified — skipping release"
            exit 0
          fi

      - name: Read version
        id: pkg
        run: echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        run: |
          VER="${{ steps.pkg.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${VER}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" \
              CHANGELOG.md > /tmp/release-notes.md
          else
            echo "Release v${{ steps.pkg.outputs.version }}" > /tmp/release-notes.md
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('/tmp/release-notes.md')
          if path.exists():
              notes = path.read_text(encoding='utf-8')
              if len(notes.encode('utf-8')) > 120000:
                  url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['GITHUB_SHA']}/CHANGELOG.md"
                  notes = notes.encode('utf-8')[:120000].decode('utf-8', errors='ignore').rsplit('\n', 1)[0]
                  path.write_text(notes + f'\n\nRelease notes shortened. [Read the full changelog]({url}).\n', encoding='utf-8')
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" &>/dev/null; then
            echo "Release v${{ steps.pkg.outputs.version }} already exists — skipping creation"
          else
            gh release create "v${{ steps.pkg.outputs.version }}" \
              --title "v${{ steps.pkg.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Archive source
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            .
            !.git

      - name: Trigger Kiru-Ai Build
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'kiru-ai-build.yml',
              ref: context.ref,
            })
